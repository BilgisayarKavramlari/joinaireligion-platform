# ─────────────────────────────────────────────────────────────────────────────
# CI → Deploy  |  joinaireligion
#
# Triggers on every push to main.
# Two sequential jobs:
#   verify  — install deps, run all unit tests, type-check
#   deploy  — SSH into VPS, pull code, preserve .env, rebuild the app
#             container, and verify health endpoints
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VPS_HOST        — IP address or hostname of the production VPS
#   VPS_USER        — Restricted SSH user (joinai-deploy)
#   VPS_SSH_KEY     — Full PEM private key (public half in ~/.ssh/authorized_keys on VPS)
#   VPS_PORT        — SSH port number (default: 22)
#
# The VPS exposes one root-owned, allowlisted command to this user:
#   sudo -n /usr/local/sbin/joinai-deploy
#
# Secret safety: secrets are referenced with ${{ secrets.NAME }} which GitHub
# automatically masks in all log output.  Scripts never echo secret values.
# ─────────────────────────────────────────────────────────────────────────────

name: CI → Deploy

on:
  push:
    branches: [main]

# Prevent two deploys running simultaneously; never cancel an in-flight deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Job 1: Verify ───────────────────────────────────────────────────────────
  verify:
    name: Verify (audit + tests + type-check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high/critical gate)
        run: npm run audit:high

      # Prisma generate is triggered by @prisma/client postinstall but we run
      # it explicitly so any schema drift surfaces as a build error.
      - name: Generate Prisma client
        run: npx prisma generate

      # Run all unit tests (all DB calls are mocked — no real DB required).
      - name: Run tests
        run: npm run test:ci

      # Type-check the application source (excludes __tests__ via tsconfig.verify.json).
      - name: Type-check
        run: npx tsc --noEmit --skipLibCheck --project tsconfig.verify.json

      # Full Next.js build with a placeholder DB URL so Prisma module imports
      # don't throw at compile time.  The real production build happens in the
      # Docker container on the VPS.
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
          NEXT_PUBLIC_APP_URL: https://joinaireligion.com
          NODE_ENV: production

  # ── Job 2: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: verify          # only runs if verify succeeds
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            sudo -n /usr/local/sbin/joinai-deploy

      # ── Notify on failure ────────────────────────────────────────────────────
      # Uncomment and configure if you want Slack/email alerts on deploy failure.
      # - name: Notify failure
      #   if: failure()
      #   run: echo "Deploy failed — add notification step here"
